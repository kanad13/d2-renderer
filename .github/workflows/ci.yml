name: CI / Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test Container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        run: |
          docker build -t d2-renderer:test .

      - name: Run container
        run: |
          docker run -d --name d2-test -p 8080:8080 --add-host=host.docker.internal:host-gateway d2-renderer:test

      - name: Wait for service health
        run: |
          timeout 30s bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run integration test suite
        run: |
          python3 -m unittest discover -s tests -v

      - name: Cleanup test container
        if: always()
        run: |
          docker rm -f d2-test || true

  publish:
    name: Publish to GitHub Container Registry
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job writes packages; the test job and pull requests stay read-only.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 image, so Apple Silicon and other
      # arm64 hosts pull a native image from the same tag.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ github.sha }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both platforms are published
        run: |
          manifest="$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest)"
          echo "$manifest"
          echo "$manifest" | grep -q "linux/amd64"
          echo "$manifest" | grep -q "linux/arm64"

  deploy:
    name: Deploy to Cloud Run
    needs: publish
    # Skipped on forks and fresh clones until the GCP_* repository variables exist.
    # Runs on manual workflow dispatch so everyday pushes do not touch live Cloud Run state.
    if: github.event_name == 'workflow_dispatch' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token Google verifies
    steps:
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # The full commit SHA tag is unique per build, so Cloud Run never serves a cached
      # copy of an older image the way it could with :latest.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: d2-renderer
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ghcr.io/${{ github.repository }}:${{ github.sha }}
          timeout: 30s
          flags: >-
            --port=8080
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --concurrency=8
            --cpu=1
            --memory=512Mi
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
